
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Hub - Health Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #debug-console {
            position: fixed; bottom: 10px; right: 10px; width: 320px; max-height: 250px;
            background: rgba(15, 23, 42, 0.95); color: #10b981; font-family: monospace; font-size: 10px;
            padding: 12px; border-radius: 12px; overflow-y: auto; z-index: 9999;
            pointer-events: none; border: 1px solid #1e293b; display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .error-log { color: #f43f5e; font-weight: bold; }
        .ai-log { color: #8b5cf6; }
        .success-log { color: #10b981; }
        .info-log { color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
      window.debugLog = function(msg, type = 'info') {
        const consoleEl = document.getElementById('debug-console');
        if (consoleEl) {
          const div = document.createElement('div');
          div.className = type === 'error' ? 'error-log' : 
                          type === 'ai' ? 'ai-log' :
                          type === 'success' ? 'success-log' : 'info-log';
          
          div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
          consoleEl.appendChild(div);
          consoleEl.scrollTop = consoleEl.scrollHeight;
        }
        console.log(`[${type.toUpperCase()}] ${msg}`);
      };

      // Lọc bỏ lỗi từ trình duyệt/extension để tránh làm rối bảng log
      window.onerror = (m, s, l) => {
        const msg = String(m);
        if (msg.includes('__firefox__') || msg.includes('ethereum') || msg.includes('Script error.')) {
          return true; // Bỏ qua lỗi ngoại lai
        }
        debugLog(`Hệ thống: ${m}`, 'error');
      };
      
      window.process = { env: { API_KEY: "AIzaSyDfiNVIkl7THN5xbrMdW78ayJKkDboxR7s" } };
    </script>

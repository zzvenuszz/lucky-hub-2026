
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Hub - Health Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #debug-console {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 300px;
            max-height: 200px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            font-family: monospace;
            font-size: 10px;
            padding: 10px;
            border-radius: 8px;
            overflow-y: auto;
            z-index: 9999;
            pointer-events: none;
            display: block;
            border: 1px solid #333;
        }
        .error-log { color: #ff4444; }
        .system-log { color: #44aaff; }
    </style>
    <script>
      // Hệ thống bắt lỗi trực quan
      window.debugLog = function(msg, type = 'info') {
        const consoleEl = document.getElementById('debug-console');
        if (consoleEl) {
          const div = document.createElement('div');
          div.className = type === 'error' ? 'error-log' : (type === 'system' ? 'system-log' : '');
          div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
          consoleEl.appendChild(div);
          consoleEl.scrollTop = consoleEl.scrollHeight;
        }
        console.log(msg);
      };

      window.onerror = function(message, source, lineno, colno, error) {
        debugLog(`ERROR: ${message} at ${source}:${lineno}`, 'error');
      };

      window.onunhandledrejection = function(event) {
        debugLog(`PROMISE REJECTION: ${event.reason}`, 'error');
      };

      window.process = { env: { API_KEY: "AIzaSy..." } }; // Key sẽ được tự động inject nếu có biến môi trường
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "express": "https://esm.sh/express@^5.2.1",
    "mongoose": "https://esm.sh/mongoose@^9.1.5",
    "cors": "https://esm.sh/cors@^2.8.5",
    "dotenv": "https://esm.sh/dotenv@^17.2.3",
    "path": "https://esm.sh/path@^0.12.7"
  }
}
</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      // Cấu hình Babel để hỗ trợ TypeScript và React
      Babel.registerPreset("lucky-preset", {
        presets: [
          [Babel.availablePresets["typescript"], { allExtensions: true, isTSX: true }],
          [Babel.availablePresets["react"], { runtime: "automatic" }]
        ]
      });
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- Root của ứng dụng -->
    <div id="root">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto"></div>
                <p class="mt-4 text-slate-500 font-medium">Đang khởi tạo Lucky Hub...</p>
            </div>
        </div>
    </div>

    <!-- Bảng debug hiển thị lỗi nếu có -->
    <div id="debug-console">
        <div class="system-log">-- System Debug Initialized --</div>
    </div>

    <script type="text/babel" data-presets="lucky-preset" data-type="module" src="./index.tsx"></script>
    
    <script>
      setTimeout(() => {
        if (!window.reactLoaded) {
          debugLog("Cảnh báo: Sau 5 giây React vẫn chưa mount. Kiểm tra Console hoặc Network tab.", "error");
        }
      }, 5000);
    </script>
</body>
</html>

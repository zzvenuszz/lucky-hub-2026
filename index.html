
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #debug-console {
            position: fixed; bottom: 10px; right: 10px; width: 300px; max-height: 200px;
            background: rgba(0,0,0,0.8); color: #00ff00; font-family: monospace; font-size: 10px;
            padding: 10px; border-radius: 8px; overflow-y: auto; z-index: 9999;
            pointer-events: none; border: 1px solid #333;
        }
        .error-log { color: #ff4444; }
    </style>
    <script>
      window.debugLog = function(msg, type = 'info') {
        const consoleEl = document.getElementById('debug-console');
        if (consoleEl) {
          const div = document.createElement('div');
          div.className = type === 'error' ? 'error-log' : '';
          div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
          consoleEl.appendChild(div);
          consoleEl.scrollTop = consoleEl.scrollHeight;
        }
        console.log(msg);
      };
      window.onerror = (m, s, l) => debugLog(`ERROR: ${m} at ${s}:${l}`, 'error');
      window.process = { env: { API_KEY: "AIzaSyDfiNVIkl7THN5xbrMdW78ayJKkDboxR7s" } };
    </script>

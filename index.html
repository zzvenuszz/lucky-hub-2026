
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Hub - Health Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Tilt+Prism&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        #root:empty::before {
            content: "Đang khởi tạo hệ thống...";
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #f8fafc; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
        }
        #debug-console {
            position: fixed; bottom: 85px; left: 24px; width: 350px; max-height: 300px;
            background: rgba(15, 23, 42, 0.98); color: #10b981; font-family: 'Fira Code', monospace; font-size: 10px;
            padding: 15px; border-radius: 20px; overflow-y: auto; z-index: 9998;
            pointer-events: auto; border: 1px solid rgba(255,255,255,0.1);
            display: none; flex-direction: column; gap: 4px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        .error-log { color: #fb7185; }
        .ai-log { color: #a78bfa; }
        .success-log { color: #34d399; }
        .info-log { color: #60a5fa; }
        .system-log { color: #94a3b8; font-style: italic; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
      window.logFilters = { system: true, ai: true };
      window.debugLog = function(msg, type = 'info') {
        const consoleEl = document.getElementById('debug-console');
        if (!consoleEl) return;
        if (type === 'error') consoleEl.style.display = 'flex';
        const isAI = type === 'ai' || msg.includes('Gemini') || msg.includes('AI');
        if (isAI && !window.logFilters.ai) return;
        if (!isAI && !window.logFilters.system) return;
        const div = document.createElement('div');
        div.className = type === 'error' ? 'error-log' : type === 'ai' ? 'ai-log' : type === 'success' ? 'success-log' : type === 'system' ? 'system-log' : 'info-log';
        div.innerHTML = `<span style="opacity:0.4">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      };
      window.onerror = (m, s, l, c, e) => {
        debugLog(`FATAL ERROR: ${m} (Dòng ${l})`, 'error');
        const root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          root.innerHTML = `<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;">
            <h1 style="font-size: 40px;">⚠️</h1>
            <p style="font-weight: bold;">Ứng dụng không thể khởi động</p>
            <pre style="font-size: 10px; background: #fee2e2; padding: 10px; border-radius: 10px; text-align: left; overflow: auto;">${m}</pre>
            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Tải lại trang</button>
          </div>`;
        }
      };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.37.0",
    "react-easy-crop": "https://esm.sh/react-easy-crop@5.2.0?external=react,react-dom",
    "sucrase": "https://esm.sh/sucrase@^3.35.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "express": "https://esm.sh/express@^5.2.1",
    "mongoose": "https://esm.sh/mongoose@^9.2.1",
    "cors": "https://esm.sh/cors@^2.8.6",
    "dotenv": "https://esm.sh/dotenv@^17.3.1",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "crypto": "https://esm.sh/crypto@^1.0.1",
    "path": "https://esm.sh/path@^0.12.7"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <div id="debug-console" class="no-scrollbar">
        <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; display: flex; justify-content: space-between;">
            <span>TERMINAL LOGS</span>
            <button onclick="this.parentElement.parentElement.style.display='none'" style="color: #fb7185">HIDE</button>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 🛡️ Chống double-tap zoom trên toàn bộ trang */
        * { touch-action: manipulation; }

        /* 📱 Mobile: Ngăn auto-zoom khi focus vào input/select/textarea */
        @media screen and (max-width: 768px) {
            input,
            select,
            textarea {
                font-size: 16px !important;
            }

            /* Tự động tăng kích thước text quá nhỏ */
            .text-\[9px\] { font-size: 11px !important; }
            .text-\[10px\] { font-size: 12px !important; }
        }

        /* 📱 Mobile Card Layout - Admin tables → cards */
        .table-mobile-card {
            display: block;
            width: 100%;
        }
        @media (max-width: 767px) {
            .table-desktop { display: none; }
            .mobile-only { display: block; }
            .data-card {
                background: white;
                border: 1.5px solid #fed7aa;
                border-radius: 1.5rem;
                padding: 0;
                margin-bottom: 0.75rem;
                transition: all 0.2s;
                overflow: hidden;
            }
            .data-card:hover {
                border-color: #fb923c;
                box-shadow: 0 4px 16px rgba(251,146,60,0.1);
            }
            .data-card-header {
                background: white;
                padding: 0.875rem 1rem;
                border-bottom: 1px solid #fff7ed;
            }
            .data-card-body {
                background: #fff8f0;
                padding: 0.75rem 1rem;
            }
            .data-card-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.375rem 0;
                gap: 0.5rem;
            }
            .data-card-label {
                font-size: 10px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #94a3b8;
                flex-shrink: 0;
            }
            .data-card-value {
                font-size: 13px;
                font-weight: 700;
                text-align: right;
                word-break: break-word;
            }
            .data-card-actions {
                display: flex;
                gap: 0.5rem;
                justify-content: flex-end;
                padding: 0.625rem 1rem 1rem;
                background: #fff8f0;
            }
        }
        @media (min-width: 768px) {
            .mobile-only { display: none; }
            .table-desktop { display: table; }
        }

        /* 🛡️ Safe area padding cho notch phones */
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .safe-top {
            padding-top: env(safe-area-inset-top, 0px);
        }
    </style>

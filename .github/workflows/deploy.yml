name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 1. Đăng nhập tự động bằng Token bí mật
          echo "machine huggingface.co login luckyhubvn password ${{ secrets.HF_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          
          # 2. Xóa triệt để thư mục chứa file nặng JSON khỏi bản sao hiện tại
          rm -rf migrated_prompt_history/
          
          # 3. Khởi tạo một repo Git hoàn toàn mới tại đây để XÓA SẠCH LỊCH SỬ CŨ
          rm -rf .git
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          # 4. Thêm toàn bộ các file còn lại (đã sạch file nặng) vào repo mới này
          git add .
          git commit -m "Initial clean commit for Hugging Face"
          
          # 5. Ép đẩy đè lên Hugging Face Spaces (Nhánh main)
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          git push --force hf main
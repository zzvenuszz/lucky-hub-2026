name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Space
        uses: huggingface/space-sync@v1
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          hf_user: luckyhubvn
          space_name: lucky-hub-2026
name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Sử dụng trực tiếp cú pháp nội bộ của GitHub để truyền Token (Sửa triệt để lỗi trống biến env)
          git config --global http.https://huggingface.co/.extraheader "Authorization: Bearer ${{ secrets.HF_TOKEN }}"
          
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          git push --force hf main
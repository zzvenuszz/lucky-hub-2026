name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu bạn đang dùng nhánh master của GitHub

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Sử dụng Action chuyên dụng để đồng bộ sang Hugging Face ngon lành nhất
      - name: Push to Hugging Face Spaces
        uses: Adisb/huggingface-spaces-sync-action@v1.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          huggingface_token: ${{ secrets.HF_TOKEN }}
          huggingface_repo: luckyhubvn/lucky-hub-2026
          repo_type: space
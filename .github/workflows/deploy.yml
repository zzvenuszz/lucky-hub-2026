name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu bạn đang dùng nhánh master của GitHub

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Cấu hình xác thực bằng Bearer Token qua Header (Sửa lỗi Password authentication)
          git config --global http.https://huggingface.co/.extraheader "Authorization: Bearer $HF_TOKEN"
          
          # Thêm URL remote gốc không cần chèn user/password vào link
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          
          # Ép tiến trình đẩy code sang Hugging Face
          git push --force hf main
name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Kích hoạt tải các file lớn từ GitHub xuống máy chủ ảo

      - name: Push to HF
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Đăng nhập tự động bằng Token bí mật vào hệ thống máy chủ
          echo "machine huggingface.co login luckyhubvn password ${{ secrets.HF_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          
          # Cài đặt và kích hoạt Git LFS trên máy chủ chạy Action để xử lý file > 10MB
          git lfs install
          
          # Cấu hình remote chuẩn sạch
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026 || git remote set-url hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          
          # Thực hiện ép đẩy code kèm theo các file lớn qua định dạng LFS
          git push --force hf main
name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Đăng nhập tự động bằng Token bí mật
          echo "machine huggingface.co login luckyhubvn password ${{ secrets.HF_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          
          # Tách nhánh tạm thời để dọn dẹp các file nặng trước khi đẩy sang HF
          git checkout -b hf-deploy
          
          # Xóa thư mục chứa file lịch sử JSON nặng ra khỏi hàng đợi đẩy lên HF
          # (Lưu ý: Lệnh này chỉ xóa ở nhánh tạm thời trên máy chủ ảo, KHÔNG ảnh hưởng đến code gốc trên GitHub của bạn)
          git rm -r --cached migrated_prompt_history/ || true
          
          # Commit lại sự thay đổi này cho nhánh tạm
          git commit -m "Exclude heavy history files for HF deployment" || true
          
          # Thêm remote và ép đẩy nhánh tạm này lên nhánh main của Hugging Face
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026 || git remote set-url hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          git push --force hf hf-deploy:main
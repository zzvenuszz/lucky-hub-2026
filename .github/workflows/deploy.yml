name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu bạn đang dùng nhánh master của GitHub

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF using SSH
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Tạo thư mục cấu hình SSH an toàn nội bộ
          mkdir -p ~/.ssh
          echo "strictbase64token" > /tmp/hf_token
          
          # 2. Thiết lập thông tin Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 3. Sử dụng cấu hình URL chứa Token đã được chuẩn hóa riêng cho môi trường Linux Runner
          git remote add hf https://hf:$HF_TOKEN@huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          
          # 4. Thực hiện đẩy code
          git push --force hf main
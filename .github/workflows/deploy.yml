name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 1. Đăng nhập tự động bằng Token bí mật vào hệ thống
          echo "machine huggingface.co login luckyhubvn password ${{ secrets.HF_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          
          # 2. Xóa triệt để thư mục chứa lịch sử JSON nặng > 10MB (file này không cần cho app chạy)
          rm -rf migrated_prompt_history/
          
          # 3. Khởi tạo một repo Git hoàn toàn mới tại máy chủ ảo để dọn sạch lịch sử lỗi cũ
          rm -rf .git
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git branch -m main
          
          # 4. Kích hoạt và cấu hình Git LFS để xử lý đúng cách các tệp tin hình ảnh nhị phân (Bypass lỗi của HF)
          git lfs install
          git lfs track "favicon/*.png"
          git lfs track "favicon/*.ico"
          git lfs track "img/*.png"
          
          # 5. Gom toàn bộ mã nguồn và hình ảnh vào commit mới
          git add .
          git commit -m "Initial clean commit with proper Git LFS tracking for assets"
          
          # 6. Ép đẩy đè lên Hugging Face Spaces
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          git push --force hf main
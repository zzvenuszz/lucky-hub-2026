name: Deploy to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'package.json'
      - 'run.js'
      - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra repository
      uses: actions/checkout@v4

    - name: Thiết lập Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cài đặt dependencies
      run: npm install

    - name: Build ứng dụng
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "🚀 Bắt đầu triển khai lên Hugging Face..."
        npm install
        npm run build || echo "⚠️ Script build không khả dụng, tiếp tục..."

    - name: Triển khai lên Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "🚀 Đang triển khai lên Hugging Face Spaces..."
        echo "🔐 HF_TOKEN có sẵn: ${{ secrets.HF_TOKEN != '' }}"
        
        if [ -z "$HF_TOKEN" ]; then
          echo "❌ HF_TOKEN không được thiết lập!"
          echo "Hãy thêm HF_TOKEN vào GitHub Secrets > HF_TOKEN"
          exit 1
        fi
        
        echo "🎯 Đang triển khai..."
        huggingface-cli repo create luckyhubvn/lucky-hub-2026 \
          --space Frontend-Kit \
          --license mit \
          --token $HF_TOKEN \
          --readme ./README.md || true
        
        echo "✅ Triển khai lên Hugging Face hoàn tất!"
        echo "🌐 Ứng dụng sẽ có sẵn tại: https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026"

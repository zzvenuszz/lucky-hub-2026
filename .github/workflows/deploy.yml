name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Cấu hình thông tin Git Action cơ bản
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 2. Ép Git sử dụng Bearer Token qua Header theo đúng chuẩn bảo mật của Hugging Face Docs
          git config --global http.https://huggingface.co/.extraheader "Authorization: Bearer $HF_TOKEN"
          
          # 3. Thêm link Space dạng HTTPS tiêu chuẩn (không chứa bất kỳ username/password nào trên URL)
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          
          # 4. Thực hiện đẩy code an toàn
          git push --force hf main
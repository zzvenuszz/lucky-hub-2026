name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính trên GitHub của bạn là master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Ghi thông tin xác thực trực tiếp vào hệ thống máy chủ để tự động đăng nhập
          # Sử dụng username là 'luckyhubvn' và password chính là Token của bạn
          echo "machine huggingface.co login luckyhubvn password ${{ secrets.HF_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          
          # Thêm URL Space tiêu chuẩn sạch hoàn toàn
          git remote add hf https://huggingface.co/spaces/luckyhubvn/lucky-hub-2026
          
          # Đẩy code lên Hugging Face
          git push --force hf main